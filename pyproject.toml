[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "phylogeoplot"
version = "0.1.4"
description = "Linked phylogenetic and geographic visualization in Python."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Tahiri Lab" }
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "biopython>=1.79",
    "cartopy>=0.21",
    "rasterio>=1.3",
    "matplotlib>=3.5",
    "pandas>=1.4",
    "numpy>=1.22",
    "scikit-image>=0.19",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "pytest",
]

[project.urls]
Homepage = "https://github.com/tahiri-lab/PhyloGeoPlot"
Repository = "https://github.com/tahiri-lab/PhyloGeoPlot"

[tool.setuptools.packages.find]
where = ["."]
include = ["phylogeoplot*"]
namespaces = false
