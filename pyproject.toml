[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "phylocartoplot"
version = "0.1.0"
description = "Phylogeographic visualization: overlay phylogenetic trees on geographic raster maps"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "biopython>=1.79",
    "cartopy>=0.21",
    "rasterio>=1.3",
    "matplotlib>=3.5",
    "pandas>=1.4",
    "numpy>=1.22",
    "scikit-image>=0.19",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "pytest",
]

[project.urls]
Homepage = "https://github.com/tahiri-lab/PhyloCartoPlot"
Repository = "https://github.com/tahiri-lab/PhyloCartoPlot"

[tool.setuptools.packages.find]
where = ["."]
include = ["phylocartoplot*"]
