name: Publish to PyPI

# Publishes the package to PyPI whenever a GitHub Release is published.
#
# This workflow uses PyPI "Trusted Publishing" (OpenID Connect), so no
# PyPI API token is needed. Before the first release, the maintainer must
# configure a trusted publisher on PyPI:
#
#   1. Create the project on PyPI (or publish once manually) so that the
#      project name "phylocartoplot" exists, OR configure a pending
#      trusted publisher for a project that does not exist yet at:
#      https://pypi.org/manage/account/publishing/
#   2. Add a new trusted publisher with:
#        - PyPI Project Name: phylocartoplot
#        - Owner: tahiri-lab
#        - Repository name: PhyloCartoPlot
#        - Workflow name: publish.yml
#        - Environment name: pypi
#   3. (Optional but recommended) Repeat the same steps on
#      https://test.pypi.org/manage/account/publishing/ for the
#      "testpypi" environment/job below, using Environment name: testpypi.
#   4. Create a "pypi" (and optionally "testpypi") environment under the
#      repository Settings > Environments, matching the names above.
#
# Once configured, cut a release by creating a GitHub Release (or a tag
# starting with "v", e.g. v0.1.4) and this workflow will build and upload
# the distribution automatically.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_to_testpypi:
        description: "Publish the built distribution to TestPyPI"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: dist
          path: dist/

  publish-to-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.publish_to_testpypi
    environment:
      name: testpypi
      url: https://test.pypi.org/project/phylocartoplot/
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4.3.0
        with:
          name: dist
          path: dist/

      - name: Publish package to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # This workflow only triggers on 'release' (types: [published]) and
    # 'workflow_dispatch', so github.event_name == 'release' implies the
    # release was just published.
    if: github.event_name == 'release'
    environment:
      name: pypi
      url: https://pypi.org/project/phylocartoplot/
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4.3.0
        with:
          name: dist
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
